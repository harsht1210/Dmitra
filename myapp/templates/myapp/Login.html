{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | D. Mitra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand text-white" href="{% url 'home' %}">D. Mitra</a>
            <div class="ms-auto">
                <a class="nav-link text-white small" href="{% url 'products' %}">Back to Shop</a>
            </div>
        </div>
    </nav>

    <div class="row g-0 login-split">
        <div class="col-md-6 login-image-col">
            <img src="https://images.unsplash.com/photo-1550751827-4bd374c3f58b?ixlib=rb-4.0.3&auto=format&fit=crop&w=1600&q=80"
                alt="Login Visual" class="login-image">
        </div>

        <div class="col-md-6 login-form-col">
            <div class="login-container">
                <h1 class="mb-2">Log In</h1>
                <p class="mb-5 text-white-50 text">New to this site? <a href="{% url 'signup' %}" class="auth-link">Sign
                        Up</a></p>

                <form method="POST" action="{% url 'login' %}">
                    {% csrf_token %}

                    <div class="mb-3">
                        <input type="email" name="email" class="form-control login-input" placeholder="Email" required>
                    </div>

                    <div class="mb-1">
                        <input type="password" name="password" class="form-control login-input" placeholder="Password"
                            required>
                    </div>
                    <button type="submit" class="btn btn-outline-light w-100 py-2 mt-4">Log In</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
