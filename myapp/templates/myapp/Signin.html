{% load static %} 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | D. Mitra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/Signin.css' %}">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand text-white" href="{% url 'home' %}">D. Mitra</a>
            <div class="ms-auto">
                <a class="nav-link text-white small" href="{% url 'login' %}">Log In</a>
            </div>
        </div>
    </nav>

    <div class="row g-0 auth-split">
        <div class="col-md-6 auth-image-col">
            <img src="https://images.unsplash.com/photo-1550745165-9bc0b252726f?ixlib=rb-4.0.3&auto=format&fit=crop&w=1600&q=80" alt="Sign Up Visual" class="auth-image">
        </div>

        <div class="col-md-6 auth-form-col">
            <div class="auth-container">
                <h1 class="mb-2" style="font-weight: 400;">Sign Up</h1>
                <p class="mb-5 text-light">Already a member? <a href="{% url 'login' %}" class="auth-link">Log In</a></p>

                <form method="POST" action="{% url 'signup' %}">
                    {% csrf_token %}
                    
                    <div class="row">
                        <div class="col-6">
                            <input type="text" name="first_name" class="form-control auth-input" placeholder="First Name" required>
                        </div>
                        <div class="col-6">
                            <input type="text" name="last_name" class="form-control auth-input" placeholder="Last Name" required>
                        </div>
                    </div>

                    <div class="mb-1">
                        <input type="email" name="email" class="form-control auth-input" placeholder="Email" required>
                    </div>
                    
                    <div class="mb-4">
                        <input type="password" name="password" class="form-control auth-input" placeholder="Password" required>
                    </div>

                    <div class="form-check mb-4">
                        <input class="form-check-input bg-dark border-secondary" type="checkbox" name="subscribe" value="yes" id="flexCheckDefault">
                        <label class="form-check-label text-light small" for="flexCheckDefault">
                            Yes, subscribe me to your newsletter.
                        </label>
                    </div>

                    <button type="submit" class="btn btn-outline-light w-100 py-2">Sign Up</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
